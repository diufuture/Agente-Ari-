<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071a2e" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef4f9" media="(prefers-color-scheme: light)" />
  <title>Entrar · Click Control</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/icono.svg" type="image/svg+xml" />
</head>
<body class="pantalla-entrada">
  <main class="entrada-caja">
    <div class="marca-logo grande">
      <svg class="marca-mark" viewBox="0 0 192 192" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-linecap="round">
              <path d="M96 34a62 62 0 0 1 62 62" stroke-width="7"/>
              <path d="M96 158a62 62 0 0 1-62-62" stroke-width="7"/>
              <path d="M96 54a42 42 0 0 1 42 42" stroke-width="6"/>
              <path d="M96 138a42 42 0 0 1-42-42" stroke-width="6"/>
              <path d="M96 73a23 23 0 0 1 23 23" stroke-width="5"/>
              <path d="M96 119a23 23 0 0 1-23-23" stroke-width="5"/>
            </g>
            <circle cx="96" cy="96" r="8" fill="currentColor"/>
          </svg>
    </div>
    <h1 class="marca-nombre"><i>click</i> control</h1>
    <p class="subtitulo">Entrá para hablar con Ari</p>

    <form id="form">
      <label>
        <span>Usuario</span>
        <input id="usuario" name="usuario" type="text" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false" required />
      </label>
      <label>
        <span>Contraseña</span>
        <input id="clave" name="clave" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" id="enviar">Entrar</button>
      <p class="error" id="error"></p>
    </form>
  </main>

  <script type="module">
    const $ = (s) => document.querySelector(s);

    $('#form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const boton = $('#enviar');
      const error = $('#error');
      boton.disabled = true;
      boton.textContent = 'Entrando…';
      error.textContent = '';

      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: $('#usuario').value, clave: $('#clave').value }),
        });
        const datos = await r.json().catch(() => ({}));
        if (r.ok) {
          location.replace('/');
          return;
        }
        error.textContent = datos.error || 'No se pudo entrar.';
      } catch {
        error.textContent = 'No se pudo conectar con el servidor.';
      }
      boton.disabled = false;
      boton.textContent = 'Entrar';
      $('#clave').select();
    });

    $('#usuario').focus();
  </script>
</body>
</html>
